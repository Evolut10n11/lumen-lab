[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-lab"
version = "0.1.0"
description = "A small auditable engine for self-directed software experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Lumen Lab"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
lumen = "lumen_lab.cli:main"
lumen-calibrate = "lumen_lab.calibration_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
