name: Lumen Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Generate pulse
        run: lumen pulse
      - name: Commit changed pulse
        shell: bash
        run: |
          if git diff --quiet -- state/PULSE.md; then
            echo "Pulse unchanged."
            exit 0
          fi
          git config user.name "lumen-lab[bot]"
          git config user.email "lumen-lab[bot]@users.noreply.github.com"
          git add state/PULSE.md
          git commit -m "chore: refresh Lumen pulse"
          git push
