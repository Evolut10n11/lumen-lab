name: Generate desktop lockfile

on:
  push:
    branches:
      - "chore/npm-lockfile-reproducibility"
    paths:
      - ".github/workflows/generate-desktop-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/npm-lockfile-reproducibility
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate package-lock.json
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: add desktop package lockfile"
          git push origin HEAD:chore/npm-lockfile-reproducibility
