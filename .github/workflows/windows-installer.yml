name: Windows Installer

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/lumen_lab/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Lumen desktop engine build tools
        run: python -m pip install -e ".[desktop]"

      - name: Build standalone Lumen engine
        run: python -m PyInstaller --noconfirm --clean --onefile --name lumen-engine packaging/lumen_engine_entry.py

      - name: Smoke test standalone engine
        shell: pwsh
        run: |
          $request = '{"action":"bootstrap","user_id":"packaged-smoke","payload":{}}'
          $response = $request | & .\dist\lumen-engine.exe
          $response | Write-Host
          $payload = $response | ConvertFrom-Json
          if (-not $payload.ok) { throw "Packaged engine returned an error." }
          if ($payload.data.initialized -ne $false) { throw "Unexpected packaged bootstrap state." }

      - name: Stage engine for Tauri bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps\desktop\src-tauri\resources | Out-Null
          Copy-Item dist\lumen-engine.exe apps\desktop\src-tauri\resources\lumen-engine.exe -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Use stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Generate Windows icon set
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build Lumen Windows installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/*.exe --repo "${{ github.repository }}" --generate-notes --title "Lumen ${{ github.ref_name }}"
