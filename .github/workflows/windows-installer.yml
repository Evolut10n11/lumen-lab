name: Windows Installer

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/lumen_lab/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - "src/lumen_lab/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $config = Get-Content apps\desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Release tag ${{ github.ref_name }} does not match desktop version $($config.version); expected $expected."
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Lumen desktop engine build tools
        run: python -m pip install -e ".[desktop]"

      - name: Build standalone Lumen engine
        run: python -m PyInstaller --noconfirm --clean --onefile --name lumen-engine packaging/lumen_engine_entry.py

      - name: Smoke test standalone engine
        shell: pwsh
        run: |
          $request = '{"action":"bootstrap","user_id":"packaged-smoke","payload":{}}'
          $response = $request | & .\dist\lumen-engine.exe
          $response | Write-Host
          $payload = $response | ConvertFrom-Json
          if (-not $payload.ok) { throw "Packaged engine returned an error." }
          if ($payload.data.initialized -ne $false) { throw "Unexpected packaged bootstrap state." }

      - name: Stage engine for Tauri bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps\desktop\src-tauri\resources | Out-Null
          Copy-Item dist\lumen-engine.exe apps\desktop\src-tauri\resources\lumen-engine.exe -Force

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Use stable Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable

      - name: Generate Windows icon set
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/lumen.svg

      - name: Build Lumen Windows installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Install and smoke test NSIS bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps\desktop\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }

          $installDir = "C:\lumen-installed-smoke-$PID"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)." }

          $engine = Get-ChildItem -Path $installDir -Filter lumen-engine.exe -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Installed bundle does not contain lumen-engine.exe." }

          Push-Location $installDir
          try {
            $request = '{"action":"bootstrap","user_id":"installed-smoke","payload":{}}'
            $response = $request | & $engine.FullName
            $response | Write-Host
            $payload = $response | ConvertFrom-Json
            if (-not $payload.ok) { throw "Installed engine returned an error." }
            if ($payload.data.initialized -ne $false) { throw "Unexpected installed bootstrap state." }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/*.exe --repo "${{ github.repository }}" --generate-notes --title "Lumen ${{ github.ref_name }}"
