name: Windows Installer

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/lumen_lab/**"
      - "packaging/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-installer.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - "src/lumen_lab/**"
      - "packaging/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate desktop release versions
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python packaging/check_release.py --ref "$env:RELEASE_REF"

      - name: Install Lumen desktop engine build tools
        run: python -m pip install -e ".[desktop]"

      - name: Build standalone Lumen engine
        run: python -m PyInstaller --noconfirm --clean --onefile --name lumen-engine packaging/lumen_engine_entry.py

      - name: Smoke test standalone engine
        shell: pwsh
        run: |
          $request = '{"action":"bootstrap","user_id":"packaged-smoke","payload":{}}'
          $response = $request | & .\dist\lumen-engine.exe
          $response | Write-Host
          $payload = $response | ConvertFrom-Json
          if (-not $payload.ok) { throw "Packaged engine returned an error." }
          if ($payload.data.initialized -ne $false) { throw "Unexpected packaged bootstrap state." }

      - name: Verify standalone engine Unicode roundtrip
        run: python packaging/check_engine_text.py --engine dist/lumen-engine.exe

      - name: Stage engine for Tauri bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps\desktop\src-tauri\resources | Out-Null
          Copy-Item dist\lumen-engine.exe apps\desktop\src-tauri\resources\lumen-engine.exe -Force

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate Windows icon set
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/lumen.svg

      - name: Build Lumen Windows installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Install and smoke test NSIS bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps\desktop\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }

          $installDir = "C:\lumen-installed-smoke-$PID"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)." }

          $engine = Get-ChildItem -Path $installDir -Filter lumen-engine.exe -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Installed bundle does not contain lumen-engine.exe." }

          Push-Location $installDir
          try {
            $request = '{"action":"bootstrap","user_id":"installed-smoke","payload":{}}'
            $response = $request | & $engine.FullName
            $response | Write-Host
            $payload = $response | ConvertFrom-Json
            if (-not $payload.ok) { throw "Installed engine returned an error." }
            if ($payload.data.initialized -ne $false) { throw "Unexpected installed bootstrap state." }
          }
          finally {
            Pop-Location
          }

          python packaging/check_engine_text.py --engine $engine.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installed engine corrupted Unicode or saved progress." }

          $desktop = Get-ChildItem -Path $installDir -Filter lumen-desktop.exe -Recurse |
            Where-Object { $_.Name -ne 'lumen-engine.exe' } |
            Select-Object -First 1
          if (-not $desktop) { throw "Installed bundle does not contain lumen-desktop.exe." }

          $gui = Start-Process -FilePath $desktop.FullName -WorkingDirectory $desktop.DirectoryName -PassThru
          try {
            Start-Sleep -Seconds 8
            $gui.Refresh()
            if ($gui.HasExited) {
              throw "Installed Lumen GUI exited during startup with code $($gui.ExitCode)."
            }
          }
          finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lumen-windows-installer-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')"
          tag="v${version}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          fi

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; nothing to publish."
            exit 0
          fi

          # A pre-existing tag must identify the exact commit used for this installer.
          # Network/auth failures must stop publication rather than look like a missing tag.
          python3 packaging/check_release.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "$tag" release-assets/*.exe \
              --repo "${GITHUB_REPOSITORY}" \
              --generate-notes \
              --title "Lumen $tag"
          else
            gh release create "$tag" release-assets/*.exe \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "Lumen $tag"
          fi
