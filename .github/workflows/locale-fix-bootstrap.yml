name: Locale fix bootstrap

on:
  push:
    branches:
      - feat/runtime-fix-i18n
    paths:
      - .github/workflows/locale-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-fix-i18n
          fetch-depth: 0

      - name: Wire locale synchronization into dashboard and desktop precedence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_service = Path("src/lumen_lab/app_service.py")
          text = app_service.read_text(encoding="utf-8")
          import_anchor = "from .localization import is_russian, normalize_locale\n"
          if "from .locale_sync import synchronize_workspace_locale\n" not in text:
              if import_anchor not in text:
                  raise SystemExit("app_service localization import anchor not found")
              text = text.replace(
                  import_anchor,
                  "from .locale_sync import synchronize_workspace_locale\n" + import_anchor,
                  1,
              )

          dashboard_anchor = (
              "        locale = normalize_locale(locale)\n"
              "        workspace = self.workspace(user_id)\n"
              "        profile = load_profile(workspace.profile_path)\n"
              "        missions = load_missions(workspace.missions_path)\n"
              "        feedback = load_feedback(workspace.feedback_path)\n"
              "        radar = radar_snapshot(missions, top=top, profile=profile, feedback=feedback)\n"
          )
          dashboard_replacement = (
              "        locale = normalize_locale(locale)\n"
              "        workspace = self.workspace(user_id)\n"
              "        synchronize_workspace_locale(workspace, locale)\n"
              "        profile = load_profile(workspace.profile_path)\n"
              "        missions = load_missions(workspace.missions_path)\n"
              "        feedback = load_feedback(workspace.feedback_path)\n"
              "        radar = radar_snapshot(missions, top=top, profile=profile, feedback=feedback)\n"
          )
          if "synchronize_workspace_locale(workspace, locale)" not in text:
              if dashboard_anchor not in text:
                  raise SystemExit("dashboard integration anchor not found")
              text = text.replace(dashboard_anchor, dashboard_replacement, 1)
          app_service.write_text(text, encoding="utf-8")

          app = Path("apps/desktop/src/App.tsx")
          text = app.read_text(encoding="utf-8")
          old = "const resolved = result.context?.locale ?? result.dashboard?.locale ?? result.locale;"
          new = "const resolved = result.dashboard?.locale ?? result.locale ?? result.context?.locale;"
          if new not in text:
              if old not in text:
                  raise SystemExit("desktop locale precedence anchor not found")
              text = text.replace(old, new, 1)
          app.write_text(text, encoding="utf-8")
          PY

      - name: Validate targeted locale regression tests
        run: |
          python -m pip install -e ".[dev]"
          ruff check src/lumen_lab/locale_sync.py tests/test_locale_switching.py src/lumen_lab/app_service.py
          pytest -q tests/test_locale_switching.py

      - name: Commit fix and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/locale-fix-bootstrap.yml
          git config user.name "Lumen Lab Automation"
          git config user.email "59265019+Evolut10n11@users.noreply.github.com"
          git add src/lumen_lab/app_service.py apps/desktop/src/App.tsx src/lumen_lab/locale_sync.py tests/test_locale_switching.py
          git commit -m "fix: persist and fully apply desktop locale switches"
          git push origin HEAD:feat/runtime-fix-i18n
