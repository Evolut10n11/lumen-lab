name: Temporary desktop version sync

on:
  push:
    branches:
      - "release/desktop-v0.1.4"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Synchronize package lock metadata
        working-directory: apps/desktop
        run: npm version 0.1.4 --no-git-tag-version --allow-same-version
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/package.json apps/desktop/package-lock.json; then
            echo "Version metadata already synchronized."
            exit 0
          fi
          git config user.name "lumen-lab[bot]"
          git config user.email "lumen-lab[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/package-lock.json
          git commit -m "release: sync desktop lockfile version"
          git push
