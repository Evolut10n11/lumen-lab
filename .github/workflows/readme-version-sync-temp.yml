name: Temporary README version sync

on:
  push:
    branches:
      - "release/desktop-v0.1.4"

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update installer example
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "Lumen_0.1.3_x64-setup.exe"
          new = "Lumen_0.1.4_x64-setup.exe"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r} occurrence, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit README update
        shell: bash
        run: |
          git config user.name "lumen-lab[bot]"
          git config user.email "lumen-lab[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update Windows installer example to 0.1.4"
          git push
